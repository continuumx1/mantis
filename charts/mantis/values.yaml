# Default values for the Mantis Helm chart. See charts/mantis/README.md for
# a full walkthrough and values reference.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Both services share one Docker Hub repo, split by a "-engine"/"-web" tag
# suffix (e.g. cx1tech/mantis:0.1.0-preview.2-engine). tag defaults to
# .Chart.AppVersion.
image:
  repository: cx1tech/mantis
  tag: ""
  pullPolicy: IfNotPresent

# mantis-engine: the only component that talks to Kubernetes (read-only
# RBAC, see rbac.create below). Never exposed outside the cluster.
engine:
  replicaCount: 1
  showAll: false   # MANTIS_SHOW_ALL — include system-managed ConfigMaps/Secrets

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532   # distroless's nonroot UID — required; kubelet can't verify a named user
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# mantis-web: serves the UI + login, proxies /api to mantis-engine. This is
# the one you expose (Ingress / LoadBalancer / port-forward).
web:
  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: mantis.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532   # same distroless base as engine
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

serviceAccount:
  create: true   # only mantis-engine uses this; mantis-web needs no Kubernetes access
  name: ""
  annotations: {}

rbac:
  create: true   # read-only ClusterRole/ClusterRoleBinding for mantis-engine (see templates/rbac.yaml)

networkPolicy:
  enabled: false   # restrict mantis-engine's inbound traffic to mantis-web only
