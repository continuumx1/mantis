{{/* Always ClusterIP: only mantis-web reaches mantis-report (via /api/report). */}}
{{- if .Values.report.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mantis.report.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mantis.report.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.report.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mantis.report.selectorLabels" . | nindent 4 }}
{{- end }}
