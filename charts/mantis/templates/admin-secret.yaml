{{- /*
The administrator account mantis-web signs in. The password comes from
auth.adminPassword, or is generated once and then kept across upgrades. The
Secret holds the password (so an operator can read a generated one) and its
bcrypt hash, which is what mantis-web uses.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "mantis.admin.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
{{- $oldPassword := index $data "password" | default "" | b64dec }}
{{- $oldHash := index $data "passwordHash" | default "" | b64dec }}
{{- $password := "" }}
{{- $hash := "" }}
{{- if .Values.auth.adminPassword }}
{{- if lt (len .Values.auth.adminPassword) 8 }}
{{- fail "auth.adminPassword must be at least 8 characters" }}
{{- end }}
{{- $password = .Values.auth.adminPassword }}
{{- if and $oldHash (eq $oldPassword $password) }}
{{- $hash = $oldHash }}
{{- else }}
{{- $hash = htpasswd "admin" $password | trimPrefix "admin:" }}
{{- end }}
{{- else if and $oldPassword $oldHash }}
{{- $password = $oldPassword }}
{{- $hash = $oldHash }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- $hash = htpasswd "admin" $password | trimPrefix "admin:" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mantis.web.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.auth.adminUsername | default "admin" | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  passwordHash: {{ $hash | b64enc | quote }}
{{- end }}
