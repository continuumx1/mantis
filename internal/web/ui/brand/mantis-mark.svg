<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 30 760 760" role="img" aria-label="Mantis">
  <defs>
    <path id="mm-body" d="M512 322C668 322 752 410 786 620C806 760 816 900 814 1020C812 1260 690 1402 512 1402C334 1402 212 1260 210 1020C208 900 218 760 238 620C272 410 356 322 512 322Z"/>
    <clipPath id="mm-clip"><use href="#mm-body"/></clipPath>
    <path id="mm-wing" d="M226 770C156 806 84 896 44 984C28 1024 48 1058 96 1050C146 1040 190 1018 218 1000Z"/>
  </defs>
  <g stroke="#0E1712" stroke-linecap="round" stroke-linejoin="round">
    <!-- feet -->
    <ellipse cx="300" cy="1384" rx="58" ry="30" transform="rotate(-28 300 1384)" fill="#8D9886" stroke-width="12"/>
    <ellipse cx="724" cy="1384" rx="58" ry="30" transform="rotate(28 724 1384)" fill="#8D9886" stroke-width="12"/>
    <!-- wings -->
    <g fill="#8D9886" stroke-width="12">
