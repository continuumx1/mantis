<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantis</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="alternate icon" type="image/webp" href="mantis-mascot.webp">
<script>
  // Apply the saved theme before first paint, so there is no flash.
  try {
    var t = localStorage.getItem("mantis-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  } catch (e) {}
</script>
<!-- graph-view.css styles the Topology page; app-shell.css (loaded after it)
     is the Mantis design system for everything else, and maps the topology's
     color tokens onto the same palette. -->
<link rel="stylesheet" href="graph-view.css">
<link rel="stylesheet" href="app-shell.css">
</head>
<body>
<div class="m-shell" id="shell">
  <aside class="m-sidebar" aria-label="Main navigation">
    <div class="m-brand"><img src="brand/mantis-mark.svg" alt=""><b>Mantis</b></div>
    <nav class="m-nav" id="mNav"></nav>
    <div class="m-side-foot"><button id="mRail" aria-label="Collapse sidebar"></button></div>
  </aside>

  <div class="m-main">
    <div class="m-topbar">
      <button class="m-iconbtn m-hamburger" id="mHamburger" aria-label="Open navigation"><svg class="m-ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="m-title" id="mTitle"></div>
      <div class="m-grow"></div>
      <div class="m-ctx m-cluster" id="mCluster" title="Mantis reads one cluster per engine"></div>
      <select class="m-ctx" id="mNs" aria-label="Namespace"><option value="">All namespaces</option></select>
      <div class="m-gsearch" role="search">
        <svg class="m-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="mSearch" type="search" placeholder="Search resources…" autocomplete="off" spellcheck="false" aria-label="Search resources" aria-controls="mSearchResults">
        <kbd data-key="K">Ctrl K</kbd>
        <div class="m-gresults" id="mSearchResults" role="listbox"></div>
      </div>
      <button class="m-sync" id="mSync" aria-label="Sync status — click to refresh"></button>
      <button class="m-iconbtn" id="mThemeBtn"></button>
      <div class="m-menu-wrap">
        <button class="m-iconbtn" id="mUserBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account"><span class="m-avatar" id="mAvatar">A</span></button>
        <div class="m-menu" id="mUserMenu" role="menu">
          <div class="m-menu-h"><b id="mUserName">admin</b><small>Administrator</small></div>
          <a href="#/access" role="menuitem">Access &amp; authentication</a>
          <a href="#/settings" role="menuitem">Settings</a>
          <button data-report role="menuitem">Download report…</button>
          <button id="mSignOut" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>

    <div class="m-content" id="mContent" tabindex="-1"></div>

    <!-- Topology: the graph renderer (graph-view.js) mounts here unchanged. -->
    <main class="m-topo" id="topoPage" hidden>
      <div class="controls">
        <button class="btn" id="fit" title="Fit the whole graph on screen">Fit</button>
        <button class="btn" id="expandAll" title="Expand every group in this view">Expand all</button>
        <button class="btn" id="collapseAll" title="Back to the overview: collapse every group">Overview</button>
        <button class="btn" data-report title="Download a password-protected PDF report of the cluster">Report</button>
      </div>
      <div class="m-topo-search search-wrap">
        <span class="search-ico">⌕</span>
        <input class="search" id="search" type="text" placeholder="Find in graph…" autocomplete="off" spellcheck="false" aria-label="Find in graph" />
        <kbd class="search-kbd" data-key="F">Ctrl F</kbd>
        <div class="search-results" id="searchResults"></div>
      </div>
      <svg id="canvas" role="img" aria-label="Cluster resource graph"></svg>
      <div class="viewbar" id="viewbar"></div>
      <div class="legend" id="legend">
      <div class="legend-body"></div>
      <button class="legend-toggle" id="legendToggle" aria-label="Toggle legend" title="Legend">
        <svg class="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.75" fill="currentColor" stroke="none"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
      <aside class="panel collapsed" id="panel">
      <div class="panel-resizer" id="panelResizer" title="Drag to resize"></div>
      <button class="panel-collapse" id="panelCollapse" title="Clear focus (Esc)" aria-label="Clear focus">✕</button>
      <div class="panel-content" id="panelContent"></div>
    </aside>
      <div class="ymodal-overlay" id="ymodalOverlay">
      <div class="ymodal">
        <div class="ymodal-head">
          <div class="ymodal-title" id="ymodalTitle"></div>
          <div class="ymodal-search">
            <span class="search-ico">⌕</span>
            <input id="ymodalSearch" type="text" placeholder="Find in YAML…" autocomplete="off" spellcheck="false" />
            <kbd class="search-kbd ymodal-kbd" data-key="F">Ctrl F</kbd>
            <span class="ymodal-match-count" id="ymodalMatchCount"></span>
            <button class="ymodal-nav" id="ymodalPrev" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
            <button class="ymodal-nav" id="ymodalNext" title="Next match (Enter)" aria-label="Next match">↓</button>
          </div>
          <div class="yaml-actions">
            <button class="copy-btn" id="ymodalCopy">Copy</button>
            <button class="ymodal-close" id="ymodalClose" title="Close (Esc)" aria-label="Close">✕</button>
          </div>
        </div>
        <pre class="yaml ymodal-pre" id="ymodalPre"></pre>
      </div>
    </div>
      <div class="toast" id="toast"><span class="tdot"></span><span id="toastMsg"></span></div>
      <div class="overlay" id="overlay" style="display:none"></div>
    </main>
  </div>
</div>

<script src="graph-engine.js"></script>
<script src="graph-view.js"></script>
<script src="report-layout.js"></script>
<script src="app-shell.js"></script>
</body>
</html>
