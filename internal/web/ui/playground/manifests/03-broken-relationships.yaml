---
apiVersion: v1
kind: Namespace
metadata:
  name: payments-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payments-cache
  namespace: payments-api
spec:
  accessModes: ["ReadWriteOnce"]
  # A storage class that does not exist — this PVC will sit Pending forever
  # and never get a bound-to edge to a PersistentVolume, a common real-world
  # "why is my volume never ready" failure mode.
  storageClassName: fast-ssd-nonexistent
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-api
  labels:
    app: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # This ConfigMap does not exist — Mantis surfaces the reference as a
          # "not found" edge instead of hiding it, and the Pods themselves sit
          # in CreateContainerConfigError as a result.
          envFrom:
            - configMapRef:
                name: payments-config-v2
          volumeMounts:
            - name: cache
              mountPath: /var/cache/payments-api
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: payments-cache
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api-svc
  namespace: payments-api
spec:
  # Selector doesn't match the Deployment's real "app: payments-api" label
  # (typo'd as "-old") — the Service exists and resolves fine, but selects
  # zero Pods, so it ends up with no serves edges at all: an orphaned Service.
  selector:
    app: payments-api-old
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-ingress
  namespace: payments-api
spec:
  rules:
    - host: payments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # This Service was renamed/removed and the Ingress was never
                # updated — the canonical dangling reference: Mantis draws it
                # as a red, dashed "not found" node instead of silently
                # dropping the edge.
                name: payments-svc-old
                port:
                  number: 80
