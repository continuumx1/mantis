<title>KNW — Cluster Resource Graph</title>

<style>
  :root {
    color-scheme: dark;
    --ground: #0a0e13; --ground-2: #0e141b; --panel: #121a23; --panel-2: #172230; --line: #223041;
    --ink: #e7eef6; --muted: #8595a6; --faint: #5a6b7d; --brand: #a6e22e;
    --cat-workload: #6ea8fe; --cat-pod: #a6e22e; --cat-network: #d980fb; --cat-config: #e3b341; --cat-storage: #34d1bf; --cat-node: #96a4b5;
    --ns-knwdemo: #a6e22e; --ns-default: #6ea8fe; --ns-kubesystem: #d980fb; --ns-cluster: #8595a6;
    --ok: #3fb950; --warn: #d29922; --crit: #f85149;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--ground-2), var(--ground)); z-index: 5; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 10px 1px color-mix(in srgb, var(--brand) 70%, transparent); }
  .brand b { font-family: var(--font-mono); font-size: 18px; letter-spacing: 1px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .chip { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .chip b { color: var(--brand); font-weight: 600; }
  .spacer { flex: 1; }
  .stat { color: var(--faint); font-size: 12px; font-family: var(--font-mono); }
  .stat b { color: var(--muted); }

  main { position: relative; flex: 1; min-height: 0; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, color-mix(in srgb, var(--cat-pod) 4%, transparent), transparent 60%), radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size: 100% 100%, 26px 26px; background-position: center, center; cursor: grab; touch-action: none; }
  #canvas.panning { cursor: grabbing; }

  .region-box { fill-opacity: 0.05; stroke-width: 1; stroke-opacity: .5; }
  .region-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .5px; }

  .edge { stroke-linecap: round; transition: stroke-opacity .18s, stroke-width .18s; }
  .edge-label { font-family: var(--font-mono); font-size: 10px; fill: var(--ink); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; opacity: 0; transition: opacity .18s; pointer-events: none; }

  .node { cursor: pointer; }
  .node .chip-bg { fill: var(--panel-2); stroke: var(--line); stroke-width: 1; transition: stroke .18s, filter .18s; }
  .node .kind { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .6px; text-transform: uppercase; }
  .node .name { font-family: var(--font-mono); font-size: 11.5px; fill: var(--ink); }
  .node .sub  { font-family: var(--font-mono); font-size: 8px; fill: var(--crit); letter-spacing: .5px; }
  .node .ready { font-family: var(--font-mono); font-size: 9px; font-weight: 600; text-anchor: end; }
  .node .hpa { font-family: var(--font-mono); font-size: 9px; fill: var(--brand); text-anchor: end; }
  .node:hover .chip-bg { stroke: color-mix(in srgb, var(--brand) 55%, var(--line)); }
  .node.selected .chip-bg { stroke: var(--brand); stroke-width: 1.6; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--brand) 45%, transparent)); }
  .node.dim { opacity: .22; }
  .node.ghost .chip-bg { stroke: var(--crit); stroke-dasharray: 4 3; fill: color-mix(in srgb, var(--crit) 8%, var(--panel-2)); }
  .node.ghost .name { fill: var(--muted); }

  .status-ring { fill: none; stroke-width: 2; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .status-crit .status-ring { stroke: var(--crit); animation: pulse 1.6s ease-in-out infinite; }
  .status-ok .status-ring { stroke: var(--ok); opacity:.8; }
  @media (prefers-reduced-motion: reduce) { .status-crit .status-ring { animation: none; opacity:.9; } }

  .legend { position: absolute; left: 16px; bottom: 16px; z-index: 4; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 11.5px; max-width: 240px; }
  .legend h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--muted); font-family: var(--font-mono); }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .legend .ln { width: 16px; border-top-width: 2px; border-top-style: solid; flex: none; }
  .legend .divider { height: 1px; background: var(--line); margin: 10px 0; }

  .panel { position: absolute; top: 14px; right: 14px; bottom: 14px; width: 320px; z-index: 6; background: color-mix(in srgb, var(--panel) 95%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .panel .hint { color: var(--faint); font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .panel .hint b { color: var(--muted); }
  .p-kind { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
  .p-name { font-family: var(--font-mono); font-size: 15px; word-break: break-all; line-height: 1.35; color: var(--ink); }
  .p-ns { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 20px; border: 1px solid; width: fit-content; }
  .badge::before { content:""; width:7px; height:7px; border-radius:50%; background: currentColor; }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: color-mix(in srgb, var(--crit) 12%, transparent); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tab { padding: 7px 11px; font-size: 11px; font-family: var(--font-mono); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand); border-color: var(--brand); }

  .kv { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .kv > div { display: flex; gap: 8px; }
  .kv .k { color: var(--faint); min-width: 84px; font-family: var(--font-mono); }
  .kv .v { color: var(--muted); font-family: var(--font-mono); word-break: break-all; }
  .kv .v.warnval { color: var(--crit); }

  .sec-h { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 4px 0 2px; }
  .ctr { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; font-family: var(--font-mono); font-size: 11px; }
  .ctr .top { display: flex; align-items: center; gap: 7px; }
  .ctr .cdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ctr .cname { color: var(--ink); font-weight: 600; }
  .ctr .img { color: var(--muted); word-break: break-all; }
  .ctr .res { color: var(--faint); }
  .ctr .res b { color: var(--muted); font-weight: 500; }

  .hpa-card { border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--line)); border-radius: 8px; padding: 9px 10px; font-family: var(--font-mono); font-size: 11px;
    background: color-mix(in srgb, var(--brand) 6%, transparent); display: flex; flex-direction: column; gap: 4px; }
  .hpa-card .h { color: var(--brand); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .hpa-card .r { color: var(--muted); }
  .autoscale-none { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

  .ep { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .ep .cdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ep .addr { color: var(--ink); } .ep .to { color: var(--faint); margin-left: auto; }

  .rel { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-family: var(--font-mono); font-size: 12px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .rel:hover .rel-target { color: var(--brand); }
  .rel .verb { color: var(--muted); } .rel .arrow { color: var(--faint); } .rel-target { color: var(--ink); }
  .rel .cross-tag { color: var(--warn); font-size: 9px; margin-left: auto; } .rel .rk { font-size: 9px; }

  .yaml { margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: 1.5; color: var(--muted); white-space: pre; overflow-x: auto; }
  .y-key { color: var(--cat-network); } .y-val { color: var(--ink); } .y-com { color: var(--faint); } .y-dash { color: var(--faint); }

  .controls { position: absolute; top: 14px; left: 16px; z-index: 4; display: flex; gap: 8px; }
  .btn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; transition: color .15s, border-color .15s; }
  .btn:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  @media (max-width: 780px) { .panel { width: auto; left: 14px; top: auto; height: 46%; } .legend { display: none; } }
</style>

<div id="app">
  <header>
    <span class="dot"></span>
    <div class="brand"><b>KNW</b><span>Every K8s Resource Has a Story</span></div>
    <div class="chip">cluster: <b>minikube</b></div>
    <div class="spacer"></div>
    <div class="stat"><b id="nCount">0</b> resources &nbsp;·&nbsp; <b id="eCount">0</b> relationships &nbsp;·&nbsp; <b>3</b> namespaces &nbsp;·&nbsp; prototype</div>
  </header>

  <main>
    <div class="controls">
      <button class="btn" id="reset">Reset view</button>
      <button class="btn" id="relayout">Re-layout</button>
    </div>

    <svg id="canvas"><defs></defs>
      <g id="viewport"><g id="regions"></g><g id="edges"></g><g id="edgeLabels"></g><g id="nodes"></g></g>
    </svg>

    <div class="legend">
      <h4>Resource</h4>
      <div class="row"><span class="sw" style="background:var(--cat-workload)"></span>Workload</div>
      <div class="row"><span class="sw" style="background:var(--cat-pod)"></span>Pod</div>
      <div class="row"><span class="sw" style="background:var(--cat-network)"></span>Service / Ingress</div>
      <div class="row"><span class="sw" style="background:var(--cat-config)"></span>Config / Secret</div>
      <div class="row"><span class="sw" style="background:var(--cat-storage)"></span>Storage</div>
      <div class="row"><span class="sw" style="background:var(--cat-node)"></span>Node</div>
      <div class="divider"></div>
      <h4>Reading the map</h4>
      <div class="row"><span class="ln" style="border-color:var(--cat-node)"></span>relationship (edge)</div>
      <div class="row"><span class="sw" style="background:transparent;border:1px solid var(--ns-cluster)"></span>namespace region</div>
      <div class="row"><span class="ln" style="border-color:var(--crit);border-top-style:dashed"></span>not found</div>
    </div>

    <aside class="panel" id="panel"></aside>
  </main>
</div>

  };
  function yamlFor(n) {

  const groupKey = n => n.ns || "__cluster";
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  const byId = {};

  document.getElementById("nCount").textContent = nodes.length;
  document.getElementById("eCount").textContent = edges.length;

  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (t,a) => { const e = document.createElementNS(SVGNS,t); for (const k in a) e.setAttribute(k,a[k]); return e; };
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const svg = document.getElementById("canvas"), gViewport = document.getElementById("viewport"),
    gRegions = document.getElementById("regions"), gEdges = document.getElementById("edges"),
    gEdgeLabels = document.getElementById("edgeLabels"), gNodes = document.getElementById("nodes"),
    defs = svg.querySelector("defs"), panel = document.getElementById("panel");

  ["workload","network","config","storage","node"].forEach(f => {

  });

  nodes.forEach(n => { n.w = Math.min(210, Math.max(104, short(n.name).length*7 + 48)); n.h = n.resolved===false?46:40; n.x=0; n.y=0; n.vx=0; n.vy=0; n.fx=null; n.fy=null; });

  const groups = {};
  nodes.forEach(n => { const g=groupKey(n); (groups[g]=groups[g]||[]).push(n); });
  const regionEls = {};
  Object.keys(groups).forEach(g => {
    const meta = REGION[g];
    const box = el("rect",{ class:"region-box", rx:16, fill: meta.color, stroke: meta.color, "stroke-dasharray": g==="__cluster"?"6 5":"none" });
    const lbl = el("text",{ class:"region-label", fill: meta.color }); lbl.textContent = meta.label;
    gRegions.appendChild(box); gRegions.appendChild(lbl); regionEls[g] = { box, lbl };
  });

  const nodeEls = {};
  nodes.forEach(n => {
    const cls = "node" + (n.status?" status-"+n.status:"") + (n.resolved===false?" ghost":"");
    const g = el("g",{ class: cls, "data-id": n.id });
    g.appendChild(el("rect",{ class:"accent", x:-n.w/2, y:-n.h/2, width:4, height:n.h, rx:2, fill: catColor(n.cat) }));
    g.appendChild(el("rect",{ class:"chip-bg", x:-n.w/2, y:-n.h/2, width:n.w, height:n.h, rx:9 }));
    if (n.status) g.appendChild(el("circle",{ class:"status-ring", cx:n.w/2-11, cy:-n.h/2+11, r:4.5 }));
    const kind = el("text",{ class:"kind", x:-n.w/2+12, y:n.resolved===false?-6:-3, fill: catColor(n.cat) }); kind.textContent = n.kind.toUpperCase();
    const name = el("text",{ class:"name", x:-n.w/2+12, y:n.resolved===false?9:12 }); name.textContent = short(n.name);

    if (rd) { const t = el("text",{ class:"ready", x:n.w/2-9, y:5, fill: n.status==="crit"?css("--crit"):css("--ok") }); t.textContent = rd; g.appendChild(t); }
    if (hasHPA(n.id)) { const t = el("text",{ class:"hpa", x:n.w/2-9, y:-n.h/2+13 }); t.textContent = "⇅HPA"; g.appendChild(t); }
    const title = el("title"); title.textContent = n.id + (n.ns?"  (ns: "+n.ns+")":"  (cluster-scoped)"); g.appendChild(title);
    gNodes.appendChild(g); nodeEls[n.id] = g;
  });

  edges.forEach(e => {
    const fam = FAMILY[e.type] || "node", a = byId[e.from], b = byId[e.to];
    e.cross = a.ns && b.ns && a.ns !== b.ns; e.toGhost = b.resolved === false;
    const line = el("line",{ class:"edge", stroke: e.toGhost?css("--crit"):catColor(fam), "stroke-opacity":.32, "stroke-width":1.6,
      "stroke-dasharray": e.type==="runs-on"?"4 4":(e.toGhost?"5 4":"none"), "marker-end": e.toGhost?"":"url(#arrow-"+fam+")" });
    e._line = line; gEdges.appendChild(line);
    const lbl = el("text",{ class:"edge-label", "text-anchor":"middle" }); lbl.textContent = e.type; e._label = lbl; gEdgeLabels.appendChild(lbl);
  });

  // ---- layout ----
  let W = svg.clientWidth||1000, H = svg.clientHeight||640;
  const anchor = g => ({ "knw-demo":{x:W*0.26,y:H*0.34}, "default":{x:W*0.55,y:H*0.28}, "kube-system":{x:W*0.80,y:H*0.36}, "__cluster":{x:W*0.52,y:H*0.80} }[g] || {x:W/2,y:H/2});
  function seed(){ nodes.forEach(n => { const a=anchor(groupKey(n)); n.x=a.x+(Math.random()-.5)*140; n.y=a.y+(Math.random()-.5)*120; n.vx=0; n.vy=0; n.fx=null; n.fy=null; }); }
  let alpha = 1;
  function tick(){
    W = svg.clientWidth||W; H = svg.clientHeight||H;
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){ const a=nodes[i],b=nodes[j]; let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||.01,d=Math.sqrt(d2); const rep=5200/d2,ux=dx/d,uy=dy/d; a.vx+=ux*rep; a.vy+=uy*rep; b.vx-=ux*rep; b.vy-=uy*rep; }
    edges.forEach(e => { const a=byId[e.from],b=byId[e.to]; let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||.01; const k=0.032*(d-118),ux=dx/d,uy=dy/d; a.vx+=ux*k; a.vy+=uy*k; b.vx-=ux*k; b.vy-=uy*k; });
    nodes.forEach(n => { const a=anchor(groupKey(n)); n.vx+=(a.x-n.x)*0.02; n.vy+=(a.y-n.y)*0.02; });
    nodes.forEach(n => { if(n.fx!=null){ n.x=n.fx; n.y=n.fy; n.vx=0; n.vy=0; return; } n.vx*=0.82; n.vy*=0.82; n.x+=n.vx*alpha; n.y+=n.vy*alpha; });
    alpha *= 0.992; if(alpha<0.03) alpha=0.03; render();
  }
  function render(){
    Object.keys(groups).forEach(g => { const ns=groups[g]; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      ns.forEach(n => { minx=Math.min(minx,n.x-n.w/2); maxx=Math.max(maxx,n.x+n.w/2); miny=Math.min(miny,n.y-n.h/2); maxy=Math.max(maxy,n.y+n.h/2); });
      const pad=26,r=regionEls[g]; r.box.setAttribute("x",minx-pad); r.box.setAttribute("y",miny-pad); r.box.setAttribute("width",(maxx-minx)+pad*2); r.box.setAttribute("height",(maxy-miny)+pad*2);
      r.lbl.setAttribute("x",minx-pad+12); r.lbl.setAttribute("y",miny-pad-8); });
    nodes.forEach(n => nodeEls[n.id].setAttribute("transform",`translate(${n.x},${n.y})`));
    edges.forEach(e => { const a=byId[e.from],b=byId[e.to]; let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/d,uy=dy/d;
      const x1=a.x+ux*24,y1=a.y+uy*20,x2=b.x-ux*30,y2=b.y-uy*22; e._line.setAttribute("x1",x1); e._line.setAttribute("y1",y1); e._line.setAttribute("x2",x2); e._line.setAttribute("y2",y2);
      e._label.setAttribute("x",(x1+x2)/2); e._label.setAttribute("y",(y1+y2)/2-3); });
  }
  function loop(){ tick(); requestAnimationFrame(loop); } seed(); loop();

  // ---- pan/zoom ----
  const view = { x:0, y:0, k:1 };
  const applyView = () => gViewport.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); applyView();
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const r=svg.getBoundingClientRect(); const mx=ev.clientX-r.left,my=ev.clientY-r.top,f=Math.exp(-ev.deltaY*0.0016);
    const nk=Math.min(2.6,Math.max(0.3,view.k*f)); view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; applyView(); }, {passive:false});
  let drag=null;
  const world = ev => { const r=svg.getBoundingClientRect(); return { x:(ev.clientX-r.left-view.x)/view.k, y:(ev.clientY-r.top-view.y)/view.k }; };
  svg.addEventListener("pointerdown", ev => {
    const g = ev.target.closest && ev.target.closest(".node");
    if (g){ const n=byId[g.getAttribute("data-id")],w=world(ev); drag={node:n,dx:n.x-w.x,dy:n.y-w.y,moved:false}; n.fx=n.x; n.fy=n.y; alpha=Math.max(alpha,.5); }
    else { const r=svg.getBoundingClientRect(); drag={pan:true,sx:ev.clientX-r.left-view.x,sy:ev.clientY-r.top-view.y,moved:false,target:ev.target}; svg.classList.add("panning"); }

    if (drag.pan){ const r=svg.getBoundingClientRect(); view.x=ev.clientX-r.left-drag.sx; view.y=ev.clientY-r.top-drag.sy; applyView(); }
    else { const w=world(ev); drag.node.fx=w.x+drag.dx; drag.node.fy=w.y+drag.dy; alpha=Math.max(alpha,.4); } });
  svg.addEventListener("pointerup", () => { svg.classList.remove("panning"); if(drag&&!drag.pan&&drag.node){ drag.node.fx=null; drag.node.fy=null; }

  function renderEmpty(){

      '<b>Click</b> a resource for its health, containers, endpoints, autoscaling and YAML. <b>Drag</b> to arrange, <b>scroll</b> to zoom.</p>';
  }
  const badge = s => s==="ok"?'<span class="badge ok">healthy</span>':s==="crit"?'<span class="badge crit">needs attention</span>':"";
  function renderNode(n){
    const head = '<div><div class="p-kind" style="color:'+catColor(n.cat)+'">'+n.kind+'</div><div class="p-name">'+esc(n.name)+'</div>'+
      '<div class="p-ns">'+(n.ns?"namespace · "+n.ns:"cluster-scoped")+'</div></div>'+ (n.status?badge(n.status):(n.resolved===false?'<span class="badge crit">not found</span>':''));
    const tabs = '<div class="tabs">'+Object.keys(TABS).map(t=>'<div class="tab'+(t===curTab?' active':'')+'" data-tab="'+t+'">'+TABS[t]+'</div>').join('')+'</div>';
    panel.innerHTML = head + tabs + '<div id="tabbody"></div>';
    panel.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { curTab=t.getAttribute("data-tab"); renderBody(n); }));
    renderBody(n);
  }
  function renderBody(n){
    panel.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-tab")===curTab));
    const body = document.getElementById("tabbody");
    body.innerHTML = curTab==="overview" ? overviewHTML(n) : curTab==="relationships" ? relHTML(n) : yamlHTML(n);
    if (curTab==="relationships") body.querySelectorAll(".rel").forEach(r => r.addEventListener("click", () => select(r.getAttribute("data-goto"))));
  }
  const kv = rows => '<div class="kv">'+rows.filter(Boolean).map(([k,v,warn])=>'<div><span class="k">'+k+'</span><span class="v'+(warn?' warnval':'')+'">'+esc(v)+'</span></div>').join('')+'</div>';
  function overviewHTML(n){
    const d = DET[n.id] || {}; let h = "";
    if (n.cat==="pod"){
      h += kv([["ready",d.ready||"—"],["restarts",String(d.restarts??"—"),d.restarts>0],["node",d.node||"—"],["pod IP",d.ip||"—"],["QoS",d.qos||"—"]]);
      if (d.containers){ h += '<div class="sec-h">Containers</div>' + d.containers.map(c =>
        '<div class="ctr"><div class="top"><span class="cdot" style="background:'+(c.ready?css("--ok"):css("--crit"))+'"></span><span class="cname">'+esc(c.name)+'</span>'+(c.reason?'<span style="color:var(--crit);margin-left:auto">'+esc(c.reason)+'</span>':'')+'</div>'+
        '<div class="img">'+esc(c.image)+'</div>'+
        '<div class="res"><b>requests</b> '+esc(c.req)+'</div><div class="res"><b>limits</b> '+esc(c.lim)+'</div></div>').join(''); }
    } else if (n.kind==="Deployment" || n.kind==="DaemonSet"){
      h += kv([["replicas",d.replicas||"—"],["strategy",d.strategy||"—"],["image",(d.images||[]).join(", ")]]);
      h += '<div class="sec-h">Autoscaling</div>';
      if (d.hpa) h += '<div class="hpa-card"><div class="h">⇅ HorizontalPodAutoscaler</div><div class="r">'+d.hpa.min+' – '+d.hpa.max+' replicas · target '+esc(d.hpa.target)+'</div><div class="r">now: '+d.hpa.at+' replicas at '+esc(d.hpa.current)+'</div></div>';

  }
  function yamlHTML(n){
    const raw = esc(yamlFor(n));
    const hi = raw.split("\n").map(line => {
      if (/^\s*#/.test(line)) return '<span class="y-com">'+line+'</span>';

  }
  renderEmpty();

  document.getElementById("reset").addEventListener("click", () => { view.x=0; view.y=0; view.k=1; applyView(); });
  document.getElementById("relayout").addEventListener("click", () => { seed(); alpha=1; });
})();
