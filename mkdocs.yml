site_name: Mantis
site_description: Visual Kubernetes topology and relationship graph — read-only, any distribution.
site_url: https://continuumx1.github.io/mantis/
repo_name: continuumx1/mantis
repo_url: https://github.com/continuumx1/mantis
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 ContinuumX1 Technologies Private Limited

docs_dir: docs
site_dir: site
# USER_GUIDE.md is the pre-existing single-page guide (still linked from
# README.md and elsewhere for anyone reading on GitHub directly) — this site
# supersedes it as the primary docs destination but doesn't delete it.
# prototype/ is an unrelated design mockup, not documentation.
exclude_docs: |
  USER_GUIDE.md
  prototype/
  images/README.md
  README-DOCS-SITE.md

theme:
  name: material
  logo: images/mantis-muscot.webp
  favicon: images/mantis-muscot.webp
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/continuumx1/mantis
    - icon: fontawesome/brands/discord
      link: https://discord.gg/ZTB4eGfCxa
  version:
    provider: mike
    default: latest

# Every page below is a real, existing thing about Mantis's actual Public
# Preview state — no stub/"coming soon" sections. Scope grows when the
# project does, not before. See docs/README-DOCS-SITE.md for how to build
# and deploy this.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts: core-concepts.md
  - Architecture: architecture.md
  - User Guide: user-guide.md
  - Security: security.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
